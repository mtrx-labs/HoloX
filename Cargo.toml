[package]
name = "holox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
bevy = "0.20.1"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
glam = "0.33.12"
once_cell = "1.21.4"
opencv = { version = "0.102.0", features = ["clang-runtime"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
debug_preview = []

[[bin]]
name = "holox"
path = "src/main.rs"
